services:
  chatbot-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: chatbrew-api
    ports:
      - "5001:5000"
      
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ../intents.json:/app/intents.json
      - ../data.pth:/app/data.pth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Redis cache service (for scaling)
  redis:
    image: redis:7-alpine
    container_name: chatbrew-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: chatbrew-network
